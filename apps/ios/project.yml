name: EmployeeCallerID

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  EmployeeCallerID:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: EmployeeCallerID
        CODE_SIGN_ENTITLEMENTS: App/EmployeeCallerID.entitlements
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: CallDirectoryExtension
        embed: true

  CallDirectoryExtension:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: Extension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CALL_DIRECTORY_EXTENSION_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: CallDirectoryExtension
        CODE_SIGN_ENTITLEMENTS: Extension/CallDirectoryExtension.entitlements
        INFOPLIST_FILE: Extension/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"

  EmployeeCallerIDTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).Tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/EmployeeCallerID.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/EmployeeCallerID
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: EmployeeCallerID

schemes:
  EmployeeCallerID:
    build:
      targets:
        EmployeeCallerID: all
        CallDirectoryExtension: all
    test:
      gatherCoverageData: true
      targets:
        - name: EmployeeCallerIDTests
